<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7f4ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家庭寻宝">
<link rel="manifest" href="manifest.webmanifest">
<title>家庭寻宝</title>
<style>
:root{--bg:#f7f4ee;--card:#fff;--text:#272522;--muted:#777;--line:#e7e1d7;--accent:#f39b35;--green:#55a66d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}button,input{font:inherit}button{border:0}
.app{max-width:700px;margin:auto;padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 2px 12px}.title{font-size:28px;font-weight:800}.sub{font-size:14px;color:var(--muted);margin-top:4px}
.card{background:var(--card);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #00000008}.progressTop{display:flex;align-items:end;justify-content:space-between}.big{font-size:42px;font-weight:800}.pct{font-weight:700}.bar{height:10px;background:#eee8df;border-radius:99px;overflow:hidden;margin:12px 0}.fill{height:100%;background:var(--accent);border-radius:99px;transition:.3s}
.primary{background:var(--text);color:white;padding:14px 18px;border-radius:16px;font-weight:700;width:100%}.secondary{background:#eee9e0;color:var(--text);padding:11px 14px;border-radius:13px;font-weight:700}
.room{display:flex;align-items:center;gap:14px;padding:15px;background:white;border-radius:18px;margin:9px 0;cursor:pointer}.room .emoji{font-size:32px}.room .grow{flex:1}.room b{display:block}.room small{color:var(--muted)}.done{width:34px;height:34px;border-radius:50%;background:#e5f4e8;display:grid;place-items:center;color:var(--green);font-weight:800}
.sectionTitle{font-size:20px;font-weight:800;margin:20px 2px 10px}.row{display:flex;gap:10px}.row>*{flex:1}
.badge{display:flex;align-items:center;gap:14px}.badge .bemoji{font-size:38px}.badge.locked{opacity:.35}
#roomScreen{display:none}.back{background:none;padding:4px 0;font-weight:700}.roomHead{display:flex;align-items:center;gap:12px}.roomHead h1{margin:0;font-size:25px}.map{position:relative;height:390px;background:#f2eee7;border:2px solid #ded7cc;border-radius:24px;overflow:hidden;margin:14px 0;background-image:linear-gradient(#00000008 1px,transparent 1px),linear-gradient(90deg,#00000008 1px,transparent 1px);background-size:32px 32px}
.furniture{position:absolute;background:#ded8cf;border-radius:10px;display:grid;place-items:center;color:#777;font-size:22px;transform:translate(-50%,-50%);border:1px solid #d2cabe}
.pin{position:absolute;transform:translate(-50%,-50%);width:45px;height:45px;border-radius:50%;background:#fff7e9;box-shadow:0 3px 10px #0002;display:grid;place-items:center;color:var(--accent);font-size:19px;cursor:pointer;border:2px solid #f4c37d}.pin.found{background:#e9f6ec;border-color:#8ac69a;color:var(--green)}
.trow{display:flex;align-items:center;gap:12px;background:white;padding:13px;border-radius:16px;margin:8px 0}.check{width:28px;height:28px;border-radius:50%;border:2px solid #c9c2b8;background:white;color:white;display:grid;place-items:center;flex:none}.check.on{background:var(--green);border-color:var(--green)}.trow .grow{flex:1}.trow small{color:var(--muted)}
.sheet{position:fixed;inset:0;background:#0005;display:none;align-items:end;z-index:5}.sheet.open{display:flex}.sheetBox{background:var(--bg);width:100%;max-width:700px;margin:auto;border-radius:25px 25px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));animation:up .2s}.sheetBox h2{margin:0 0 5px}@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
input{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:white;margin:6px 0 12px;outline:none}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(30px);background:#25231f;color:white;padding:12px 17px;border-radius:99px;opacity:0;transition:.25s;z-index:10;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%)}
.mode{display:flex;background:#eae5dc;padding:4px;border-radius:14px;margin:10px 0}.mode button{flex:1;padding:9px;border-radius:10px;background:transparent}.mode button.active{background:white;font-weight:700;box-shadow:0 1px 5px #0001}
</style>
</head>
<body>
<div class="app">
<section id="homeScreen">
<header><div><div class="title">家庭寻宝</div><div class="sub">把所有宝藏找出来 ✨</div></div><div style="font-size:42px">🏆</div></header>
<div class="card"><div class="progressTop"><div><span class="big" id="found">0</span> <span style="color:#777;font-weight:700" id="total">/ 0</span></div><span class="pct" id="pct">0%</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="sub" id="roomProgress">已完成 0 / 0 个房间</div></div>
<div class="mode"><button id="huntBtn" class="active" onclick="setMode('hunt')">🔎 寻宝模式</button><button id="hideBtn" onclick="setMode('setup')">🔐 藏宝模式</button></div>
<div class="card"><button class="primary" onclick="showBadges()">🏅 查看徽章</button></div>
div id="rooms"></div>
<div class="sectionTitle">房间</div><button class="secondary" style="width:100%" onclick="openAddRoom()">＋ 添加房间</button>
<div id="badges" style="display:none"></div>
</section>

<section id="roomScreen">
<header><button class="back" onclick="goHome()">‹ 返回</button><div></div></header>
<div class="roomHead"><div style="font-size:38px" id="rEmoji"></div><div><h1 id="rName"></h1><div class="sub" id="rCount"></div></div></div>
<div class="map" id="map"></div>
<div class="sectionTitle">藏宝清单</div><div id="treasures"></div>
<button class="secondary" style="width:100%;margin:8px 0 30px" onclick="openAddTreasure()">＋ 添加宝藏</button>
</section>
</div>

<div class="sheet" id="sheet"><div class="sheetBox" id="sheetBox"></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='treasure-hunt-web-v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{
 rooms:[
  {id:1,name:'客厅',emoji:'🛋️',f:[
   {e:'🛋️',x:.50,y:.35,w:.42,h:.18},{e:'▰',x:.50,y:.60,w:.22,h:.12},{e:'▣',x:.22,y:.22,w:.18,h:.10}],
   t:[{n:'小恐龙',note:'沙发附近',x:.72,y:.35},{n:'小熊',note:'茶几附近',x:.48,y:.62},{n:'小汽车',note:'电视柜附近',x:.25,y:.24}]},
  {id:2,name:'卧室',emoji:'🛏️',f:[{e:'🛏️',x:.48,y:.45,w:.45,h:.30},{e:'▥',x:.78,y:.22,w:.16,h:.28}],
   t:[{n:'小兔子',note:'床头柜附近',x:.18,y:.35},{n:'小飞机',note:'衣柜附近',x:.78,y:.72}]},
  {id:3,name:'厨房',emoji:'🍳',f:[{e:'▰',x:.62,y:.50,w:.30,h:.20},{e:'▤',x:.22,y:.25,w:.18,h:.40}],
   t:[{n:'小蘑菇',note:'餐桌附近',x:.62,y:.50},{n:'小鲸鱼',note:'橱柜附近',x:.22,y:.70}]}
 ]};
let mode='hunt', current=null;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function allT(){return data.rooms.flatMap(r=>r.t)}
function found(){return allT().filter(t=>t.found).length}
function render(){
 const ts=allT(), f=found(), p=ts.length?Math.round(f/ts.length*100):0;
 document.getElementById('found').textContent=f;document.getElementById('total').textContent='/ '+ts.length;
 document.getElementById('pct').textContent=p+'%';document.getElementById('fill').style.width=p+'%';
 document.getElementById('roomProgress').textContent=`已完成 ${data.rooms.filter(r=>r.t.length&&r.t.every(t=>t.found)).length} / ${data.rooms.length} 个房间`;
 const box=document.getElementById('rooms');box.innerHTML='';
 data.rooms.forEach(r=>{
  const done=r.t.length&&r.t.every(t=>t.found);
  box.innerHTML+=`<div class="room" onclick="openRoom(${r.id})"><div class="emoji">${r.emoji}</div><div class="grow"><b>${esc(r.name)}</b><small>${r.t.filter(t=>t.found).length} / ${r.t.length} 已找到</small></div>${done?'<div class="done">✓</div>':'<div>›</div>'}</div>`;
 });
 document.getElementById('huntBtn').classList.toggle('active',mode==='hunt');document.getElementById('hideBtn').classList.toggle('active',mode==='setup');
}
function openRoom(id){current=data.rooms.find(r=>r.id===id);document.getElementById('homeScreen').style.display='none';document.getElementById('roomScreen').style.display='block';renderRoom()}
function goHome(){current=null;document.getElementById('roomScreen').style.display='none';document.getElementById('homeScreen').style.display='block';render()}
function renderRoom(){
 if(!current)return;document.getElementById('rEmoji').textContent=current.emoji;document.getElementById('rName').textContent=current.name;
 document.getElementById('rCount').textContent=`${current.t.filter(t=>t.found).length} / ${current.t.length} 已找到`;
 const map=document.getElementById('map');map.innerHTML='';
 current.f.forEach(f=>{map.innerHTML+=`<div class="furniture" style="left:${f.x*100}%;top:${f.y*100}%;width:${f.w*100}%;height:${f.h*100}%">${f.e}</div>`});
 current.t.forEach((t,i)=>{
   const pin=document.createElement('button');pin.className='pin '+(t.found?'found':'');pin.style.left=t.x*100+'%';pin.style.top=t.y*100+'%';pin.textContent=t.found?'✓':'✦';pin.onclick=()=>openTreasure(i);map.appendChild(pin)
 });
 const list=document.getElementById('treasures');list.innerHTML='';
 current.t.forEach((t,i)=>{list.innerHTML+=`<div class="trow" onclick="openTreasure(${i})"><button class="check ${t.found?'on':''}">${t.found?'✓':''}</button><div class="grow"><b>${esc(t.n)}</b><br><small>${esc(t.note||'没有备注')}</small></div><span>›</span></div>`})
}
function openTreasure(i){
 const t=current.t[i];
 document.getElementById('sheetBox').innerHTML=`<h2>${esc(t.n)}</h2><div class="sub">${esc(t.note||'没有备注')}</div><div style="height:20px"></div><button class="primary" onclick="toggleTreasure(${i})">${t.found?'↩ 标记为未找到':'✨ 找到了！'}</button><div style="height:10px"></div><button class="secondary" style="width:100%" onclick="closeSheet()">取消</button>`;
 document.getElementById('sheet').classList.add('open')
}
function toggleTreasure(i){
 const was=current.t[i].found;current.t[i].found=!was;save();closeSheet();renderRoom();render();
 if(!was){toast('✨ 宝藏发现！');if(current.t.length&&current.t.every(t=>t.found))setTimeout(()=>toast('🏆 房间完成！徽章解锁'),500)}
}
function setMode(m){mode=m;render();toast(m==='hunt'?'🔎 寻宝模式':'🔐 藏宝模式')}
function openAddRoom(){document.getElementById('sheetBox').innerHTML=`<h2>添加房间</h2><input id="rn" placeholder="例如：阳台"><input id="re" placeholder="Emoji，例如：🌿" maxlength="2"><button class="primary" onclick="addRoom()">添加</button>`;document.getElementById('sheet').classList.add('open')}
function addRoom(){const n=document.getElementById('rn').value.trim();if(!n)return;data.rooms.push({id:Date.now(),name:n,emoji:document.getElementById('re').value||'🏠',f:[],t:[]});save();closeSheet();render()}
function openAddTreasure(){document.getElementById('sheetBox').innerHTML=`<h2>添加宝藏</h2><input id="tn" placeholder="例如：小恐龙"><input id="to" placeholder="备注，例如：沙发右边"><div class="sub">新宝藏默认放在地图中央；之后可在代码数据里调整坐标。</div><div style="height:15px"></div><button class="primary" onclick="addTreasure()">添加</button>`;document.getElementById('sheet').classList.add('open')}
function addTreasure(){const n=document.getElementById('tn').value.trim();if(!n)return;current.t.push({n,note:document.getElementById('to').value.trim(),x:.5,y:.5});save();closeSheet();renderRoom();render()}
function closeSheet(){document.getElementById('sheet').classList.remove('open')}
function showBadges(){const f=found(),rooms=data.rooms.filter(r=>r.t.length&&r.t.every(t=>t.found)).length,total=allT().length;document.getElementById('sheetBox').innerHTML=`<h2>🏅 徽章收藏</h2><div style="height:12px"></div>${badge('🌟','初次发现','找到第 1 个宝藏',f>=1)}${badge('🗺️','探索家','找到 10 个宝藏',f>=10)}${badge('🏠','房间征服者','完成 1 个房间',rooms>=1)}${badge('👑','终极寻宝大师','找到全部宝藏',total>0&&f===total)}<div style="height:12px"></div><button class="secondary" style="width:100%" onclick="closeSheet()">关闭</button>`;document.getElementById('sheet').classList.add('open')}
function badge(e,t,s,on){return `<div class="card badge ${on?'':'locked'}"><div class="bemoji">${e}</div><div><b>${t}</b><div class="sub">${s}</div></div><div style="margin-left:auto">${on?'✓':'🔒'}</div></div>`}
function toast(s){const x=document.getElementById('toast');x.textContent=s;x.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>x.classList.remove('show'),1800)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
